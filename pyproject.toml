[project]
name = "mesh2d"
version = "0.1.0"
description = "Structured planar finite-volume mesh generator"
requires-python = ">=3.11,<3.15"
authors = [{name = "Mesh2D project"}]
readme = "README.md"
dependencies = ["numpy>=2.0,<3", "matplotlib>=3.9,<4"]

[project.scripts]
mesh2d = "mesh2d.cli:main"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"
